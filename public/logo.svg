<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#141B36"/>
      <stop offset="100%" stop-color="#05070F"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- lineas de circuito radiando desde el centro hacia afuera -->
  <g stroke-width="2.5" fill="none" opacity="0.55">
    <path d="M 256 256 L 256 80" stroke="url(#ringA)"/>
    <path d="M 256 256 L 400 150" stroke="url(#ringA)"/>
    <path d="M 256 256 L 432 280" stroke="url(#ringB)"/>
    <path d="M 256 256 L 340 420" stroke="url(#ringB)"/>
    <path d="M 256 256 L 150 400" stroke="url(#ringB)"/>
    <path d="M 256 256 L 82 260" stroke="url(#ringA)"/>
  </g>
  <!-- nodos en las puntas de esas lineas -->
  <g filter="url(#glow)">
    <circle cx="256" cy="80"  r="7" fill="#22D3EE"/>
    <circle cx="400" cy="150" r="6" fill="#818CF8"/>
    <circle cx="432" cy="280" r="7" fill="#A855F7"/>
    <circle cx="340" cy="420" r="6" fill="#EC4899"/>
    <circle cx="150" cy="400" r="7" fill="#EC4899"/>
    <circle cx="82"  cy="260" r="6" fill="#22D3EE"/>
  </g>

  <!-- resplandor central, tipo portal -->
  <circle cx="256" cy="256" r="110" fill="url(#core)" opacity="0.5" filter="url(#glowBig)"/>

  <!-- anillos concentricos incompletos, tipo "handshake" de protocolo -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="url(#ringA)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="180 340" transform="rotate(-40 256 256)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="url(#ringB)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="130 300" transform="rotate(120 256 256)" filter="url(#glow)"/>

  <!-- nucleo -->
  <circle cx="256" cy="256" r="26" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="26" fill="none" stroke="url(#ringA)" stroke-width="3"/>
</svg>
